<script>
export default {
    data() {
        return { ARC_LEN: 251.327 };
    },
    methods: {
        displayMax() {
            const max = Number(this.msg.payload.maxPct) || 0;
            return Math.max(120, Math.ceil(max / 10) * 10);
        },
        refBottom() {
            return (100 / this.displayMax() * 100).toFixed(1) + "%";
        },
        arcOffset(pct) {
            const f = pct === null ? 0 : Math.min(pct, 100) / 100;
            return (this.ARC_LEN * (1 - f)).toFixed(2);
        },
        arcColour(row) {
            if (row.totalPct !== null && row.totalPct >= 100) { return "#f75c5c"; }
            return row.colour;
        },
        valColour(row, u) {
            if (u.stale) { return "#6b7688"; }
            if (u.level === "high") { return "#f75c5c"; }
            return u.barColour || row.colour;
        },
        // Mix a hex colour toward white by amt (0..1).
        lighten(hex, amt) {
            const h = hex.replace("#", "");
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            const mix = (c) => Math.round(c + (255 - c) * amt);
            return "rgb(" + mix(r) + "," + mix(g) + "," + mix(b) + ")";
        },
        fillStyle(row, u) {
            if (u.pct === null) { return { height: "0%" }; }
            const h = Math.min(u.pct, this.displayMax()) / this.displayMax() * 100;
            if (u.stale) {
                return { height: h.toFixed(1) + "%", background: "#3a4556" };
            }
            const base = u.barColour || row.colour;
            const light = this.lighten(base, 0.42);
            return {
                height: h.toFixed(1) + "%",
                background: "linear-gradient(180deg," + light + "," + base + ")",
                boxShadow: "0 0 10px " + base + "66"
            };
        },
        shortTime() {
            const s = this.msg.payload.updated || "";
            const parts = s.split(", ");
            return parts.length > 1 ? parts[1] : s;
        },
        fmtKW(w) {
            if (w === null || w === undefined) { return { num: "--", unit: "" }; }
            if (Math.abs(w) >= 1000) { return { num: Math.round(w / 1000), unit: "kW" }; }
            return { num: Math.round(w), unit: "W" };
        },
        kpis() {
            const p = this.msg.payload;
            const primary = p.sections[0];
            if (!primary) { return []; }

            let loadW = 0, capW = 0, peak = 0, online = 0;
            primary.phases.forEach(row => {
                loadW += row.totalW;
                capW += row.capacityW;
                row.units.forEach(u => {
                    if (!u.stale) { online += 1; }
                    if (u.pct !== null) { peak = Math.max(peak, u.pct); }
                });
            });
            const avg = capW > 0 ? loadW / capW * 100 : 0;
            const load = this.fmtKW(loadW);

            // worst current-sharing balance across every direction shown
            let worst = null;
            p.sections.forEach(s => s.phases.forEach(row => {
                if (row.balance !== null) {
                    worst = worst === null ? row.balance : Math.min(worst, row.balance);
                }
            }));
            const balCls = worst === null ? "" : (worst >= 90 ? "green" : (worst >= 80 ? "amber" : "red"));
            const loadLabel = p.sections.length > 1 ? "OUTPUT LOAD" : "TOTAL LOAD";
            const rated = this.fmtKW(p.detected.ratedPerUnit);

            return [
                { num: online, dim: "/" + p.detected.totalUnits, label: "UNITS ONLINE", cls: "green" },
                { num: load.num, unit: load.unit, label: loadLabel },
                { num: Math.round(avg), unit: "%", label: "AVG LOAD" },
                { num: Math.round(peak), unit: "%", label: "PEAK UNIT" },
                { num: worst === null ? "--" : Math.round(worst), unit: worst === null ? "" : "%", label: "WORST BALANCE", cls: balCls },
                { num: rated.num, unit: rated.unit + "/u", label: p.detected.ratingAuto ? "RATING · AUTO" : "RATING/UNIT" },
                { num: p.detected.phases, unit: "φ", label: p.detected.unitsPerPhase + " PER PHASE" }
            ];
        }
    }
};
</script>
